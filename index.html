<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction Review</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: white;
      padding: 35px 25px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .icon {
      width: 60px;
      height: 60px;
      background: #eef2f7;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 28px;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 20px;
    }

    p {
      line-height: 1.7;
      color: #555;
      margin-bottom: 18px;
    }

    .notice {
      background: #f7f8fa;
      padding: 18px;
      border-radius: 10px;
      margin: 20px 0;
      word-break: break-word;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 25px;
    }

    button {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .approve {
      background: #222;
      color: white;
    }

    .disapprove {
      background: #e9ecef;
      color: #222;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      font-size: 13px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="icon">✓</div>

    <h1>Transaction Review</h1>

    <p>
      Your transaction has reached the final stage of processing.
    </p>

    <p>
      Please review the transaction details below and indicate whether
      you approve or disapprove the transaction.
    </p>

    <div class="notice">
      <strong>Transaction Amount:</strong><br>
      $420,500.00
      <br><br>

      <strong>Status:</strong><br>
      Awaiting confirmation
    </div>

    <div class="buttons">
      <button class="approve" onclick="window.location.href='page2.html'">
        Approve 👍
      </button>

      <button class="disapprove" onclick="alert('Transaction disapproved.')">
        Disapprove 👎
      </button>
    </div>

    <div class="footer">
      © 2026 Transaction Services
    </div>

  </div>

</body>
</html>
